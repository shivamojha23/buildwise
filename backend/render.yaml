services:
  - type: web
    name: buildwise-ai-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: USE_OLLAMA
        value: false
      - key: GEMINI_API_KEY
        sync: false          # you set this manually in Render dashboard
      - key: GEMINI_MODEL
        value: gemini-2.0-flash-lite
      - key: MAX_IMAGE_SIZE_MB
        value: 10
      - key: ALLOWED_ORIGINS
        sync: false          # you set this to your Vercel URL after deploying frontend
